<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enquete – Água Azul do Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #0f172a; font-family: 'Crimson Pro', serif; display: flex; flex-direction: column; align-items: center; padding: 20px; color: white; }
  .card { background: white; border-radius: 20px; padding: 25px; width: 100%; max-width: 500px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1; }
  .section { display: none; }
  .section.active { display: block; }
  .cand-btn { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #ddd; background: #f9f9f9; cursor: pointer; text-align: left; margin-bottom: 8px; font-size: 16px; }
  .cand-btn.selected { border-color: #1a56db; background: #eef2ff; }
  .vote-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: linear-gradient(90deg, #1a56db, #7e3af2); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .bar-row { margin-bottom: 12px; }
  .bar-track { background: #eee; height: 15px; border-radius: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: #1a56db; transition: width 0.5s; }
  #admin-link { margin-top: 50px; font-size: 12px; color: #666; cursor: pointer; text-decoration: underline; }
  
  /* PAINEL ADM - FORÇADO PARA APARECER */
  #admin-panel { 
    display: none; 
    position: fixed; 
    top:0; left:0; width:100%; height:100%; 
    background: #0f172a; 
    z-index: 9999; 
    padding: 20px; 
    overflow-y: auto; 
    color: white !important;
  }
  .adm-table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 1px solid #334155; }
  .adm-table th, .adm-table td { padding: 10px; border: 1px solid #334155; text-align: left; color: white !important; }
  .adm-table th { background: #1e293b; color: #3b82f6 !important; }
</style>
</head>
<body>

<header style="text-align:center; margin-bottom:20px;">
  <h1 style="color:white; font-family:'Oswald'">Água Azul do Norte</h1>
</header>

<div class="card">
  <div id="section-vote" class="section active">
    <div id="candidates-list"></div>
    <button class="vote-btn" onclick="submitVote()">VOTAR AGORA</button>
  </div>
  <div id="section-results" class="section">
    <h3 style="margin-bottom:15px">Resultado Parcial:</h3>
    <div id="chart-bar"></div>
    <button class="vote-btn" style="background:#0e9f6e" onclick="window.location.reload()">ATUALIZAR</button>
  </div>
</div>

<div id="admin-link" onclick="openAdmin()">Área Administrativa</div>

<div id="admin-panel">
  <h2 style="color:#3b82f6">PAINEL DE AUDITORIA</h2>
  <button onclick="closeAdmin()" style="background:red; color:white; padding:10px; border:none; margin:10px 0; border-radius:5px;">SAIR DO PAINEL</button>
  <div id="adm-content">Aguardando dados...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC7WxD8TLuaDwwUnsGmxfrYIHRyKtK507s",
  authDomain: "enquete-agua-azul.firebaseapp.com",
  databaseURL: "https://enquete-agua-azul-default-rtdb.firebaseio.com",
  projectId: "enquete-agua-azul",
  storageBucket: "enquete-agua-azul.firebasestorage.app",
  messagingSenderId: "827920537465",
  appId: "1:827920537465:web:6f2f68838af8a751be01a8"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var CANDIDATES = [
  { id: "renan", name: "Renan Lopes" },
  { id: "polaco", name: "Vereador Polaco" },
  { id: "eraclito", name: "Eraclito Gesuino" },
  { id: "romes", name: "Romes Lacerda" },
  { id: "weverson", name: "Weverson WL hotel" },
  { id: "yan", name: "Yan Massaro motos" },
  { id: "joão", name: "João da Sec de Obras" }
];

var selectedId = null;

function init() {
  var html = "";
  CANDIDATES.forEach(c => {
    html += `<button class="cand-btn" id="btn-${c.id}" onclick="selectedId='${c.id}'; document.querySelectorAll('.cand-btn').forEach(b=>b.classList.remove('selected')); this.classList.add('selected')">${c.name}</button>`;
  });
  document.getElementById("candidates-list").innerHTML = html;
  if(localStorage.getItem('voted_2026')) showResults();
}

async function submitVote() {
  if(!selectedId) return alert("Selecione um candidato");
  let city = "Não detectada";
  try { const r = await fetch('https://ipapi.co/json/'); const d = await r.json(); city = d.city + " - " + d.region_code; } catch(e){}
  
  db.ref("votes/" + selectedId).transaction(c => (c||0)+1);
  db.ref("voters/" + Date.now()).set({ city: city, cand: selectedId });
  localStorage.setItem('voted_2026', 'true');
  showResults();
}

function showResults() {
  db.ref("votes").once("value", snap => {
    var votes = snap.val() || {};
    var total = Object.values(votes).reduce((a,b)=>a+b, 0);
    var html = "";
    CANDIDATES.forEach(c => {
      var v = votes[c.id] || 0;
      var p = total > 0 ? ((v/total)*100).toFixed(1) : 0;
      html += `<div class="bar-row"><b>${c.name}</b> (${v} votos)<div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div></div>`;
    });
    document.getElementById("chart-bar").innerHTML = html;
    document.getElementById("section-vote").classList.remove("active");
    document.getElementById("section-results").classList.add("active");
  });
}

function openAdmin() {
  if(prompt("Senha:") === "Art514671@") {
    document.getElementById("admin-panel").style.display = "block";
    db.ref().once("value", snap => {
      var data = snap.val() || {};
      var voters = data.voters || {};
      var votes = data.votes || {};
      var html = "<h4>Votos por Candidato:</h4><table class='adm-table'><tr><th>Candidato</th><th>Votos</th></tr>";
      CANDIDATES.forEach(c => { html += `<tr><td>${c.name}</td><td>${votes[c.id]||0}</td></tr>`; });
      html += "</table><h4>Localização de quem votou:</h4><table class='adm-table'><tr><th>Cidade</th></tr>";
      Object.values(voters).forEach(v => { html += `<tr><td>${v.city || 'Desconhecido'}</td></tr>`; });
      html += "</table>";
      document.getElementById("adm-content").innerHTML = html;
    });
  }
}
function closeAdmin() { document.getElementById("admin-panel").style.display = "none"; }
init();
</script>
</body>
</html>
