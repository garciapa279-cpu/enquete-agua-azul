<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquete Água Azul</title>
<style>
  body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
  .alert { background: red; padding: 10px; margin-bottom: 20px; font-weight: bold; }
  .card { background: white; color: #333; padding: 20px; border-radius: 15px; max-width: 450px; margin: 0 auto; }
  .cand-btn { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; cursor: pointer; border-radius: 8px; font-weight: bold; }
  .selected { background: #1a56db; color: white; }
  .bar { background: #eee; height: 15px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
  .fill { height: 100%; background: #1a56db; }
  #admin-panel { display: none; position: fixed; inset: 0; background: #0f172a; padding: 20px; overflow-y: auto; text-align: left; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  th, td { border: 1px solid #334155; padding: 8px; }
</style>
</head>
<body>

<div class="alert">🚨 AUDITORIA ATIVA: VOTOS DE FORA SERÃO ANULADOS 🚨</div>

<div class="card">
  <div id="vote-sec">
    <h3>Escolha seu candidato:</h3>
    <div id="list"></div>
    <button onclick="enviar()" style="margin-top:15px; padding:15px 30px; background:blue; color:white; border:none; border-radius:10px; cursor:pointer;">VOTAR</button>
  </div>
  <div id="res-sec" style="display:none">
    <h3>Resultado Parcial:</h3>
    <div id="chart"></div>
    <button onclick="location.reload()" style="padding:10px; margin-top:10px;">ATUALIZAR</button>
  </div>
</div>

<p onclick="abrirAdm()" style="margin-top:50px; color:gray; cursor:pointer; font-size:12px;">Painel Administrativo</p>

<div id="admin-panel">
  <h2>LOG DE AUDITORIA</h2>
  <button onclick="location.reload()" style="background:red; color:white; padding:10px;">FECHAR</button>
  <div id="adm-data">Carregando dados...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const config = {
  apiKey: "AIzaSyC7WxD8TLuaDwwUnsGmxfrYIHRyKtK507s",
  authDomain: "enquete-agua-azul.firebaseapp.com",
  databaseURL: "https://enquete-agua-azul-default-rtdb.firebaseio.com",
  projectId: "enquete-agua-azul"
};
firebase.initializeApp(config);
const db = firebase.database();

const CANDIDATOS = [
  {id:"cicero", n:"Cícero da Farmácia"}, {id:"renan", n:"Renan Lopes"},
  {id:"polaco", n:"Vereador Polaco"}, {id:"eraclito", n:"Eraclito Gesuino"},
  {id:"romes", n:"Romes Lacerda"}, {id:"weverson", n:"Weverson WL hotel"},
  {id:"yan", n:"Yan Massaro motos"}, {id:"joão", n:"João da Sec de Obras"}
];

let sel = null;
function init() {
  let h = "";
  CANDIDATOS.forEach(c => h += `<button class="cand-btn" id="${c.id}" onclick="sel='${c.id}'; document.querySelectorAll('.cand-btn').forEach(b=>b.classList.remove('selected')); this.classList.add('selected')">${c.n}</button>`);
  document.getElementById("list").innerHTML = h;
  if(localStorage.getItem("v_v6")) mostrar();
}

async function enviar() {
  if(!sel) return alert("Selecione!");
  let cid = "Detectando...";
  try { const r = await fetch('https://ipapi.co/json/'); const d = await r.json(); cid = d.city + " (" + d.region_code + ")"; } catch(e){}
  db.ref("votes/"+sel).transaction(v => (v||0)+1);
  db.ref("voters/"+Date.now()).set({c:cid, can:sel, t:new Date().toLocaleString()});
  localStorage.setItem("v_v6", "true");
  mostrar();
}

function mostrar() {
  db.ref("votes").on("value", s => {
    let vts = s.val() || {}, tot = Object.values(vts).reduce((a,b)=>a+b,0), h = "";
    CANDIDATOS.forEach(c => {
      let v = vts[c.id]||0, p = tot>0?((v/tot)*100).toFixed(1):0;
      h += `<div>${c.n} (${v}v)<div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`;
    });
    document.getElementById("chart").innerHTML = h;
    document.getElementById("vote-sec").style.display="none";
    document.getElementById("res-sec").style.display="block";
  });
}

function abrirAdm() {
  if(prompt("Senha:") === "Art514671@") {
    document.getElementById("admin-panel").style.display="block";
    db.ref().once("value", s => {
      let d = s.val() || {}, vtr = d.voters || {}, h = "<table><tr><th>Data</th><th>Cidade</th><th>Cand</th></tr>";
      Object.values(vtr).reverse().slice(0,100).forEach(v => {
        let n = CANDIDATOS.find(c=>c.id===v.can)?.n || "--";
        h += `<tr><td>${v.t||''}</td><td>${v.c||''}</td><td>${n}</td></tr>`;
      });
      document.getElementById("adm-data").innerHTML = h + "</table>";
    });
  }
}
init();
</script>
</body>
</html>
