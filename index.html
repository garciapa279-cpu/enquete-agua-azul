<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enquete – Prefeito de Água Azul do Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    font-family: 'Crimson Pro', Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 100px;
    position: relative; overflow-x: hidden;
  }
  .bg-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse at 20% 20%, #1a56db22 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, #d61f6922 0%, transparent 60%); }
  header { text-align: center; margin-bottom: 32px; position: relative; z-index: 1; }
  .badge { display: inline-block; background: linear-gradient(90deg, #1a56db, #7e3af2); color: #fff; font-size: 11px; font-family: monospace; letter-spacing: 3px; padding: 4px 16px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
  h1 { font-size: clamp(26px, 5vw, 42px); font-weight: 700; color: #f0f4ff; line-height: 1.15; margin-bottom: 8px; text-shadow: 0 2px 20px #1a56db66; }
  .card { background: rgba(255,255,255,0.97); border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 560px; box-shadow: 0 24px 80px #00000055; position: relative; z-index: 1; }
  .section { display: none; }
  .section.active { display: block; }
  .cand-btn { width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid #e2e8f0; background: #f8fafc; cursor: pointer; text-align: left; font-size: 16px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; margin-bottom: 10px; }
  .cand-btn.selected { border-color: var(--c); background: #eff6ff; }
  .cand-dot { width: 20px; height: 20px; border: 2px solid #cbd5e1; border-radius: 50%; }
  .cand-btn.selected .cand-dot { background: var(--c); border-color: var(--c); }
  .vote-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: linear-gradient(90deg, #1a56db, #7e3af2); color: #fff; font-family: 'Oswald', sans-serif; font-size: 18px; cursor: pointer; margin-top: 10px; }
  .results-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #0e9f6e; color: #fff; font-family: 'Oswald', sans-serif; cursor: pointer; margin-top: 20px; }
  .bar-row { margin-bottom: 15px; }
  .bar-info { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; }
  .bar-track { background: #eef0f8; border-radius: 8px; height: 20px; overflow: hidden; }
  .bar-fill { height: 100%; transition: width 1s ease-out; }
  
  .warning-box { margin-top: 25px; padding: 15px; border-radius: 12px; background: #fff5f5; border: 1px dashed #feb2b2; color: #c53030; font-size: 13px; text-align: center; font-weight: 600; }

  #admin-link { color: #ffffff; font-size: 12px; margin-top: 60px; cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
  #admin-panel { display: none; position: fixed; inset: 0; background: #0f172a; z-index: 1000; color: white; padding: 20px; overflow-y: auto; }
  .adm-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1e293b; color: white; margin-bottom: 30px; }
  .adm-table td, .adm-table th { border: 1px solid #334155; padding: 12px; text-align: left; }
  .adm-table th { background: #334155; color: #3b82f6; }
</style>
</head>
<body>

<div class="bg-glow"></div>

<header>
  <div class="badge">🗳 Enquete Eleitoral 2026</div>
  <h1>Prefeitura de<br>Água Azul do Norte</h1>
</header>

<div class="card">
  <div id="section-vote" class="section active">
    <h2 style="margin-bottom:20px; font-family:'Oswald'">Escolha seu candidato:</h2>
    <div id="candidates-list"></div>
    <button class="vote-btn" id="btn-vote" onclick="submitVote()">VOTAR AGORA →</button>
  </div>

  <div id="section-thanks" class="section">
    <h2 style="color:#0e9f6e; text-align:center">Voto Confirmado!</h2>
    <button class="results-btn" onclick="showResults()">VER APURAÇÃO ATUAL →</button>
  </div>

  <div id="section-results" class="section">
    <h2 style="margin-bottom:20px; font-family:'Oswald'">Resultado Parcial:</h2>
    <div id="chart-bar"></div>
    <button class="results-btn" style="background:#1a56db" onclick="window.location.reload()">ATUALIZAR VOTOS</button>
  </div>

  <div class="warning-box">
    ⚠️ ATENÇÃO: Votos identificados fora do município de Água Azul do Norte serão ANULADOS no encerramento da enquete.
  </div>
</div>

<div id="admin-link" onclick="openAdmin()">Área do Administrador</div>

<div id="admin-panel">
  <h2 style="font-family:'Oswald'; color:#3b82f6; margin-bottom: 10px;">AUDITORIA DE VOTOS</h2>
  <button onclick="closeAdmin()" style="padding:10px 20px; margin-bottom: 20px; background:#ef4444; border:none; color:white; border-radius:5px; cursor:pointer; font-weight:bold;">FECHAR PAINEL</button>
  <div id="adm-content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC7WxD8TLuaDwwUnsGmxfrYIHRyKtK507s",
  authDomain: "enquete-agua-azul.firebaseapp.com",
  databaseURL: "https://enquete-agua-azul-default-rtdb.firebaseio.com",
  projectId: "enquete-agua-azul",
  storageBucket: "enquete-agua-azul.firebasestorage.app",
  messagingSenderId: "827920537465",
  appId: "1:827920537465:web:6f2f68838af8a751be01a8"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var CANDIDATES = [
  { id: "renan",    name: "Renan Lopes",      color: "#1a56db" },
  { id: "polaco",   name: "Vereador Polaco",   color: "#e3a008" },
  { id: "eraclito", name: "Eraclito Gesuino",  color: "#0e9f6e" },
  { id: "romes",    name: "Romes Lacerda",     color: "#d61f69" },
  { id: "weverson", name: "Dr. Weverson WL hotel",  color: "#7e3af2" },
  { id: "yan",      name: "Yan Massaro motos",     color: "#ff0000" },
  { id: "joão",     name: "João da Sec de Obras",  color: "#3f83f8" }
];

var selectedId = null;

function getFingerprint() {
    return (navigator.userAgent.length + navigator.language.length).toString() + (screen.width * screen.height);
}

function hasVoted() { return localStorage.getItem('voted_agua_azul_2026') === 'true'; }

function init() {
    renderCandidates();
    if(hasVoted()) showResults();
}

function renderCandidates() {
  var html = "";
  CANDIDATES.forEach(function(c) {
    html += '<button class="cand-btn" id="btn-cand-'+c.id+'" style="--c:'+c.color+'" onclick="selectCandidate(\''+c.id+'\')"><div class="cand-dot"></div><span>'+c.name+'</span></button>';
  });
  document.getElementById("candidates-list").innerHTML = html;
}

function selectCandidate(id) {
  if (selectedId) document.getElementById("btn-cand-"+selectedId).classList.remove("selected");
  selectedId = id;
  document.getElementById("btn-cand-"+id).classList.add("selected");
}

async function submitVote() {
  if (hasVoted()) { alert("Você já votou!"); return; }
  if (!selectedId) { alert("Selecione um candidato!"); return; }
  var btn = document.getElementById("btn-vote");
  btn.disabled = true; btn.textContent = "Validando...";
  
  let city = "Não detectada";
  try {
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();
      city = data.city + " - " + data.region_code;
  } catch(e) {}

  var fp = getFingerprint();
  db.ref("voters/" + fp).once("value", function(snap) {
      if(snap.exists()) {
          alert("Aparelho já votou.");
          localStorage.setItem('voted_agua_azul_2026', 'true');
          window.location.reload();
      } else {
          db.ref("votes/" + selectedId).transaction(function(c){ return (c||0)+1; });
          db.ref("voters/" + fp).set({ city: city, timestamp: Date.now() });
          localStorage.setItem('voted_agua_azul_2026', 'true');
          showSection("thanks");
      }
  });
}

function showResults() {
  db.ref("votes").once("value", function(snap) {
    var votes = snap.val() || {};
    var total = 0;
    Object.values(votes).forEach(function(v){ total += v; });
    var html = "";
    CANDIDATES.forEach(function(c) {
      var v = votes[c.id] || 0;
      var pct = total > 0 ? ((v/total)*100).toFixed(1) : "0.0";
      html += '<div class="bar-row"><div class="bar-info"><span>'+c.name+'</span><span>'+pct+'%</span></div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+c.color+'"></div></div><small>'+v+' votos</small></div>';
    });
    document.getElementById("chart-bar").innerHTML = html;
    showSection("results");
  });
}

function showSection(id) {
  document.querySelectorAll(".section").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById("section-" + id).classList.add("active");
}

function openAdmin() {
    if(prompt("Digite a senha:") === "Art514671@") {
        document.getElementById("admin-panel").style.display = "block";
        loadAdmData();
    }
}

function closeAdmin() { document.getElementById("admin-panel").style.display = "none"; }

function loadAdmData() {
    db.ref().once("value", function(snap) {
        var data = snap.val() || {};
        var votes = data.votes || {};
        var voters = data.voters || {};
        
        // TABELA 1: VOTOS POR NOME
        var html = "<h4 style='color:#10b981; margin-bottom:10px;'>1. CONTAGEM POR CANDIDATO</h4><table class='adm-table'><tr><th>Candidato</th><th>Votos</th></tr>";
        CANDIDATES.forEach(function(c){
            html += "<tr><td>"+c.name+"</td><td><b>"+(votes[c.id]||0)+"</b></td></tr>";
        });
        html += "</table>";

        // TABELA 2: ORIGEM DOS VOTOS
        html += "<h4 style='color:#3b82f6; margin-bottom:10px;'>2. LOCALIZAÇÃO DOS APARELHOS</h4><table class='adm-table'><tr><th>ID Aparelho</th><th>Cidade/Estado</th></tr>";
        Object.keys(voters).forEach(function(k){
            html += "<tr><td>"+k.substring(0,6)+"...</td><td>"+(voters[k].city || 'Indefinido')+"</td></tr>";
        });
        html += "</table><p>Total Geral: "+Object.keys(voters).length+" registros únicos.</p>";
        
        document.getElementById("adm-content").innerHTML = html;
    });
}

init();
</script>
</body>
</html>
