<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enquete – Água Azul do Norte</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  .alert-bar {
    background: #e11d48;
    color: white;
    padding: 12px 0;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    position: fixed;
    top: 0; left: 0; width: 100%;
    z-index: 2000;
  }

  body {
    min-height: 100vh;
    background: #0f172a;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    font-family: 'Crimson Pro', serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 16px 50px;
    color: white;
  }
  
  .card { 
    background: rgba(255,255,255,0.98); 
    border-radius: 20px; 
    padding: 30px; 
    width: 100%; 
    max-width: 500px; 
    color: #333; 
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    position: relative;
    z-index: 10;
  }

  .section { display: none; }
  .section.active { display: block; }
  
  .cand-btn { 
    width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #e2e8f0; 
    background: #f8fafc; cursor: pointer; text-align: left; margin-bottom: 10px; 
    font-size: 16px; font-weight: 600; transition: 0.2s; color: #333;
  }
  .cand-btn.selected { border-color: #1a56db; background: #eff6ff; color: #1a56db; }

  .vote-btn { 
    width: 100%; padding: 18px; border-radius: 12px; border: none; 
    background: linear-gradient(90deg, #1a56db, #7e3af2); color: white; 
    font-family: 'Oswald'; font-size: 18px; cursor: pointer; margin-top: 10px; 
  }

  .bar-row { margin-bottom: 15px; }
  .bar-info { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; }
  .bar-track { background: #eee; height: 18px; border-radius: 10px; overflow: hidden; }
  .bar-fill { height: 100%; transition: width 1s; }

  #admin-panel { 
    display: none; position: fixed; inset: 0; background: #0f172a; 
    z-index: 9999; padding: 20px; overflow-y: auto; color: white;
  }
  .adm-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; font-size: 12px; }
  .adm-table th, .adm-table td { border: 1px solid #334155; padding: 10px; text-align: left; }
  
  #admin-link { margin-top: 40px; font-size: 11px; color: rgba(255,255,255,0.3); cursor: pointer; }
</style>
</head>
<body>

<div class="alert-bar">
  <marquee scrollamount="6">🚨 AUDITORIA ATIVA: IDENTIFICAMOS VOTOS IRREGULARES DE FORA DO MUNICÍPIO. TODAS AS FRAUDES SERÃO ANULADAS NO ENCERRAMENTO PARA GARANTIR O RESULTADO REAL. 🚨</marquee>
</div>

<header style="text-align:center; margin-bottom:30px;">
  <h1 style="font-family:'Oswald'; font-size:28px;">ÁGUA AZUL DO NORTE</h1>
</header>

<div class="card">
  <div id="section-vote" class="section active">
    <h3 style="margin-bottom:20px; font-family:'Oswald'">Escolha seu candidato:</h3>
    <div id="list"></div>
    <button class="vote-btn" onclick="submitVote()">VOTAR AGORA →</button>
  </div>

  <div id="section-results" class="section">
    <h3 style="margin-bottom:20px; font-family:'Oswald'">Resultado Parcial:</h3>
    <div id="chart"></div>
    <button class="vote-btn" style="background:#0e9f6e" onclick="window.location.reload()">ATUALIZAR</button>
  </div>
</div>

<div id="admin-link" onclick="openAdmin()">Acesso Administrativo</div>

<div id="admin-panel">
  <h2>AUDITORIA DE VOTOS</h2>
  <button onclick="document.getElementById('admin-panel').style.display='none'" style="background:red; color:white; padding:10px; margin:10px 0;">FECHAR</button>
  <div id="adm-content">Carregando...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7WxD8TLuaDwwUnsGmxfrYIHRyKtK507s",
  authDomain: "enquete-agua-azul.firebaseapp.com",
  databaseURL: "https://enquete-agua-azul-default-rtdb.firebaseio.com",
  projectId: "enquete-agua-azul",
  storageBucket: "enquete-agua-azul.firebasestorage.app",
  messagingSenderId: "827920537465",
  appId: "1:827920537465:web:6f2f68838af8a751be01a8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const CANDIDATES = [
  { id: "cicero",   name: "Cícero da Farmácia", color: "#f59e0b" },
  { id: "renan",    name: "Renan Lopes",      color: "#1a56db" },
  { id: "polaco",   name: "Vereador Polaco",   color: "#e3a008" },
  { id: "eraclito", name: "Eraclito Gesuino",  color: "#0e9f6e" },
  { id: "romes",    name: "Romes Lacerda",     color: "#d61f69" },
  { id: "weverson", name: "Weverson WL hotel",  color: "#7e3af2" },
  { id: "yan",      name: "Yan Massaro motos",     color: "#ff0000" },
  { id: "joão",     name: "João da Sec de Obras",  color: "#3f83f8" }
];

let selectedId = null;

function init() {
  let h = "";
  CANDIDATES.forEach(c => {
    h += `<button class="cand-btn" id="btn-${c.id}" onclick="select('${c.id}')">${c.name}</button>`;
  });
  document.getElementById("list").innerHTML = h;
  if(localStorage.getItem('voted_v5')) showResults();
}

function select(id) {
  selectedId = id;
  document.querySelectorAll('.cand-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn-'+id).classList.add('selected');
}

async function submitVote() {
  if(!selectedId) return alert("Selecione um candidato!");
  let city = "Detectando...";
  try {
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    city = data.city + " (" + data.region_code + ")";
  } catch(e) {}

  const uid = Date.now();
  db.ref("votes/" + selectedId).transaction(c => (c||0)+1);
  db.ref("voters/" + uid).set({ city: city, cand: selectedId, t: new Date().toLocaleString() });
  localStorage.setItem('voted_v5', 'true');
  showResults();
}

function showResults() {
  db.ref("votes").on("value", snap => {
    const vts = snap.val() || {};
    let total = Object.values(vts).reduce((a,b) => a+b, 0);
    let h = "";
    CANDIDATES.forEach(c => {
      let v = vts[c.id] || 0;
      let p = total > 0 ? ((v/total)*100).toFixed(1) : 0;
      h += `<div class="bar-row"><div class="bar-info"><span>${c.name}</span><span>${p}%</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${p}%; background:${c.color}"></div></div>
            <small>${v} votos</small></div>`;
    });
    document.getElementById("chart").innerHTML = h;
    document.getElementById("section-vote").style.display = "none";
    document.getElementById("section-results").style.display = "block";
  });
}

function openAdmin() {
  if(prompt("Senha:") === "Art514671@") {
    document.getElementById("admin-panel").style.display = "block";
    db.ref().once("value", snap => {
      const data = snap.val() || {};
      const voters = data.voters || {};
      let h = "<table><tr style='color:#3b82f6'><th>Data</th><th>Cidade</th><th>Candidato</th></tr>";
      Object.values(voters).reverse().slice(0,150).forEach(v => {
        let cName = CANDIDATES.find(c => c.id === v.cand)?.name || "--";
        h += `<tr><td>${v.t||''}</td><td>${v.city||''}</td><td>${cName}</td></tr>`;
      });
      document.getElementById("adm-content").innerHTML = h + "</table>";
    });
  }
}
init();
</script>
</body>
</html>
