<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquete Água Azul - Oficial</title>
<style>
  body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
  .alert-bar { background: #1e293b; color: #f8fafc; padding: 12px 0; font-size: 13px; border-bottom: 2px solid #3b82f6; position: fixed; top: 0; left: 0; width: 100%; z-index: 2000; }
  .card { background: white; color: #333; padding: 30px; border-radius: 15px; max-width: 480px; margin: 100px auto 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-height: 300px; }
  .cand-btn { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #e2e8f0; cursor: pointer; border-radius: 10px; font-weight: 600; font-size: 16px; text-align: left; background: #f8fafc; color: #333; }
  .selected { border-color: #1a56db; background: #eff6ff; color: #1a56db; }
  .vote-btn { width: 100%; padding: 18px; background: #1a56db; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  .bar-row { margin-bottom: 18px; text-align: left; }
  .bar-track { background: #f1f5f9; height: 20px; border-radius: 10px; overflow: hidden; margin: 6px 0; border: 1px solid #e2e8f0; }
  .bar-fill { height: 100%; transition: width 1s; }
  #admin-panel { display: none; position: fixed; inset: 0; background: #0f172a; padding: 20px; z-index: 9999; overflow-y: auto; text-align: left; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 15px; background: #1e293b; color: white; }
  th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
  .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="alert-bar">
  <marquee scrollamount="5"><b>📢 COMUNICADO:</b> Auditoria em tempo real contra robôs. Encerramento amanhã às 19:00.</marquee>
</div>

<div class="card">
  <div id="vote-sec">
    <h2 style="color:#1e293b; margin-top:0;">Consulta Popular</h2>
    <div id="list"></div>
    <button class="vote-btn" id="btn-principal" onclick="enviar()">CONFIRMAR VOTO</button>
  </div>
  <div id="res-sec" style="display:none">
    <h3 style="color:#1a56db;">Resultado Parcial Auditado</h3>
    <div id="chart"></div>
    <button class="vote-btn" style="background:#0f172a" onclick="location.reload()">ATUALIZAR PLACAR</button>
  </div>
</div>

<p onclick="abrirAdm()" style="margin-top:50px; color:rgba(255,255,255,0.05); cursor:pointer;">Acesso ADM</p>

<div id="admin-panel">
  <h2>PAINEL DE AUDITORIA MANUAL</h2>
  <button onclick="location.reload()" style="background:#4b5563; color:white; padding:10px; border:none; border-radius:5px; margin-bottom:20px;">SAIR DO PAINEL</button>
  
  <div style="background:#1e293b; padding:15px; border-radius:10px; margin-bottom:20px;">
    <p><b>Instrução:</b> Para excluir um voto suspeito, clique no botão vermelho "Excluir" ao lado do registro.</p>
  </div>

  <div id="adm-data">Carregando logs...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const config = {
  apiKey: "AIzaSyC7WxD8TLuaDwwUnsGmxfrYIHRyKtK507s",
  authDomain: "enquete-agua-azul.firebaseapp.com",
  databaseURL: "https://enquete-agua-azul-default-rtdb.firebaseio.com",
  projectId: "enquete-agua-azul"
};
firebase.initializeApp(config);
const db = firebase.database();

const CANDIDATOS = [
  {id:"cicero", n:"Cícero da Farmácia", c:"#f59e0b"}, {id:"renan", n:"Renan Lopes", c:"#1a56db"},
  {id:"polaco", n:"Vereador Polaco", c:"#e3a008"}, {id:"eraclito", n:"Eraclito Gesuino", c:"#0e9f6e"},
  {id:"romes", n:"Romes Lacerda", c:"#d61f69"}, {id:"weverson", n:"Weverson WL hotel", c:"#7e3af2"},
  {id:"yan", n:"Yan Massaro motos", c:"#ff0000"}, {id:"joão", n:"João da Sec de Obras", c:"#3f83f8"}
];

let sel = null;
const LOCK_KEY = "VOTO_FINAL_AGUA_AZUL";

function init() {
  let h = "";
  CANDIDATOS.forEach(c => { h += `<button class="cand-btn" id="${c.id}" onclick="selecionar('${c.id}')">${c.n}</button>`; });
  document.getElementById("list").innerHTML = h;
  if(localStorage.getItem(LOCK_KEY)) mostrar();
}

function selecionar(id) {
  sel = id;
  document.querySelectorAll('.cand-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById(id).classList.add('selected');
}

async function enviar() {
  if(localStorage.getItem(LOCK_KEY)) return;
  if(!sel) return alert("Selecione um candidato.");
  const btn = document.getElementById("btn-principal");
  btn.disabled = true;
  try { 
    const r = await fetch('https://ipapi.co/json/'); 
    const d = await r.json(); 
    const infoLocal = (d.city || "Região") + " (" + (d.region_code || "PA") + ")";
    
    const vId = Date.now();
    db.ref("voters/" + vId).set({c:infoLocal, can:sel, t:new Date().toLocaleString('pt-BR')});
    db.ref("votes/" + sel).transaction(v => (v||0)+1);
    
    localStorage.setItem(LOCK_KEY, "true");
    mostrar();
  } catch(e){ btn.disabled = false; }
}

function mostrar() {
  db.ref("votes").on("value", s => {
    let vts = s.val() || {}, tot = Object.values(vts).reduce((a,b)=>a+b,0), h = "";
    CANDIDATOS.forEach(c => {
      let v = vts[c.id]||0, p = tot>0?((v/tot)*100).toFixed(1):0;
      h += `<div class="bar-row"><b>${c.n} (${v}v)</b><div class="bar-track"><div class="bar-fill" style="width:${p}%; background:${c.c}"></div></div></div>`;
    });
    document.getElementById("chart").innerHTML = h;
    document.getElementById("vote-sec").style.display="none";
    document.getElementById("res-sec").style.display="block";
  });
}

function abrirAdm() {
  if(prompt("Senha:") === "Art514671@") {
    document.getElementById("admin-panel").style.display="block";
    carregarLogs();
  }
}

function carregarLogs() {
  db.ref("voters").on("value", s => {
    let data = s.val() || {};
    let h = "<table><tr><th>Data</th><th>Local</th><th>Candidato</th><th>Ação</th></tr>";
    Object.keys(data).reverse().forEach(key => {
      let v = data[key];
      let nome = CANDIDATOS.find(c => c.id === v.can)?.n || v.can;
      h += `<tr><td>${v.t}</td><td>${v.c}</td><td>${nome}</td><td><button class="del-btn" onclick="apagarVoto('${key}', '${v.can}')">Excluir</button></td></tr>`;
    });
    document.getElementById("adm-data").innerHTML = h + "</table>";
  });
}

function apagarVoto(key, canId) {
    if(confirm("Deseja mesmo remover este voto? O placar será atualizado automaticamente.")) {
        db.ref("voters/" + key).remove();
        db.ref("votes/" + canId).transaction(v => (v > 0 ? v - 1 : 0));
    }
}

init();
</script>
</body>
</html>
