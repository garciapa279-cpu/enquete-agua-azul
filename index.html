<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquete Água Azul - Blindada</title>
<style>
  body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
  .alert-bar { background: #1e293b; color: #f8fafc; padding: 12px 0; font-size: 13px; border-bottom: 2px solid #3b82f6; position: fixed; top: 0; left: 0; width: 100%; z-index: 2000; }
  .card { background: white; color: #333; padding: 30px; border-radius: 15px; max-width: 480px; margin: 90px auto 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .cand-btn { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #e2e8f0; cursor: pointer; border-radius: 10px; font-weight: 600; font-size: 16px; text-align: left; background: #f8fafc; color: #333; }
  .selected { border-color: #1a56db; background: #eff6ff; color: #1a56db; }
  .vote-btn { width: 100%; padding: 18px; background: #1a56db; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  .bar-row { margin-bottom: 18px; text-align: left; }
  .bar-track { background: #f1f5f9; height: 20px; border-radius: 10px; overflow: hidden; margin: 6px 0; border: 1px solid #e2e8f0; }
  .bar-fill { height: 100%; transition: width 1s; }
  #admin-panel { display: none; position: fixed; inset: 0; background: #0f172a; padding: 20px; overflow-y: auto; text-align: left; z-index: 9999; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 15px; background: #1e293b; color: white; }
  th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
</style>
</head>
<body>

<div class="alert-bar">
  <marquee><b>AUDITORIA TÉCNICA ATIVA:</b> Filtro de localização e bloqueio de IPs duplicados em vigor.</marquee>
</div>

<div class="card">
  <div id="vote-sec">
    <h2>Consulta Popular</h2>
    <div id="list"></div>
    <button class="vote-btn" id="btn-principal" onclick="enviar()">CONFIRMAR VOTO</button>
  </div>
  <div id="res-sec" style="display:none">
    <h3 style="color:#1a56db;">Resultado Auditado</h3>
    <div id="chart"></div>
    <button class="vote-btn" style="background:#0f172a" onclick="location.reload()">ATUALIZAR PLACAR</button>
  </div>
</div>

<p onclick="abrirAdm()" style="margin-top:50px; color:rgba(255,255,255,0.1); cursor:pointer;">Painel Master</p>

<div id="admin-panel">
  <h2>CONTROLE DE AUDITORIA</h2>
  <button onclick="location.reload()" style="background:red; color:white; padding:10px;">FECHAR</button>
  <div style="margin:20px 0;">
    <button onclick="expurgar('SP')" style="background:orange; padding:10px;">LIMPAR SP</button>
    <button onclick="expurgar('BELEM')" style="background:orange; padding:10px;">LIMPAR BELÉM</button>
    <button onclick="sync()" style="background:green; color:white; padding:10px;">🔄 SINCRONIZAR (71 + REAIS)</button>
  </div>
  <div id="adm-data"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const config = {
  apiKey: "AIzaSyC7WxD8TLuaDwwUnsGmxfrYIHRyKtK507s",
  authDomain: "enquete-agua-azul.firebaseapp.com",
  databaseURL: "https://enquete-agua-azul-default-rtdb.firebaseio.com",
  projectId: "enquete-agua-azul"
};
firebase.initializeApp(config);
const db = firebase.database();

const CANDIDATOS = [
  {id:"cicero", n:"Cícero da Farmácia", c:"#f59e0b"}, {id:"renan", n:"Renan Lopes", c:"#1a56db"},
  {id:"polaco", n:"Vereador Polaco", c:"#e3a008"}, {id:"eraclito", n:"Eraclito Gesuino", c:"#0e9f6e"},
  {id:"romes", n:"Romes Lacerda", c:"#d61f69"}, {id:"weverson", n:"Weverson WL hotel", c:"#7e3af2"},
  {id:"yan", n:"Yan Massaro motos", c:"#ff0000"}, {id:"joão", n:"João da Sec de Obras", c:"#3f83f8"}
];

let sel = null;
const LOCK_KEY = "ENQUETE_FINAL_V1";

function init() {
  let h = "";
  CANDIDATOS.forEach(c => h += `<button class="cand-btn" id="${c.id}" onclick="sel='${c.id}'; document.querySelectorAll('.cand-btn').forEach(b=>b.classList.remove('selected')); document.getElementById('${c.id}').classList.add('selected')">${c.n}</button>`);
  document.getElementById("list").innerHTML = h;
  if(localStorage.getItem(LOCK_KEY)) mostrar();
}

async function enviar() {
  if(localStorage.getItem(LOCK_KEY)) return alert("Já votou.");
  if(!sel) return alert("Selecione.");
  
  const btn = document.getElementById("btn-principal");
  btn.disabled = true;

  try { 
    const r = await fetch('https://ipapi.co/json/'); 
    const d = await r.json(); 
    const ip = d.ip.replace(/\./g, '_');
    
    // VERIFICA IP NO BANCO (TRAVA DUPLA)
    db.ref("ips/" + ip).once("value", s => {
      if(s.exists()) {
        alert("Este IP já votou.");
        localStorage.setItem(LOCK_KEY, "true");
        return mostrar();
      }
      
      const infoLocal = (d.city || "Desconhecido") + " (" + (d.region_code || "??") + ")";
      const uid = Date.now();
      
      db.ref("voters/" + uid).set({c:infoLocal, can:sel, t:new Date().toLocaleString('pt-BR')});
      db.ref("ips/" + ip).set(true);
      db.ref("votes/" + sel).transaction(v => (v||0)+1);
      
      localStorage.setItem(LOCK_KEY, "true");
      mostrar();
    });
  } catch(e){ alert("Erro de conexão."); btn.disabled = false; }
}

function mostrar() {
  db.ref("votes").on("value", s => {
    let vts = s.val() || {}, tot = Object.values(vts).reduce((a,b)=>a+b,0), h = "";
    CANDIDATOS.forEach(c => {
      let v = vts[c.id]||0, p = tot>0?((v/tot)*100).toFixed(1):0;
      h += `<div class="bar-row"><b>${c.n} (${v}v)</b><div class="bar-track"><div class="bar-fill" style="width:${p}%; background:${c.c}"></div></div></div>`;
    });
    document.getElementById("chart").innerHTML = h;
    document.getElementById("vote-sec").style.display="none";
    document.getElementById("res-sec").style.display="block";
  });
}

function abrirAdm() {
  if(prompt("Senha:") === "Art514671@") {
    document.getElementById("admin-panel").style.display="block";
    loadAdm();
  }
}

function loadAdm() {
    db.ref("voters").once("value", s => {
      let vtr = s.val() || {};
      let h = "<table><tr><th>Data</th><th>Cidade</th><th>Candidato</th></tr>";
      Object.values(vtr).reverse().slice(0,300).forEach(v => {
        let n = CANDIDATOS.find(c=>c.id===v.can)?.n || v.can;
        h += `<tr><td>${v.t||''}</td><td>${v.c||''}</td><td>${n}</td></tr>`;
      });
      document.getElementById("adm-data").innerHTML = h + "</table>";
    });
}

function expurgar(tipo) {
    db.ref("voters").once("value", s => {
        let logs = s.val() || {};
        Object.keys(logs).forEach(id => {
            let cid = logs[id].c || "";
            if(tipo === 'SP' && (cid.includes("(SP)") || cid.includes("Sao Paulo"))) db.ref("voters/" + id).remove();
            if(tipo === 'BELEM' && (cid.includes("Belem") || cid.includes("Belém"))) db.ref("voters/" + id).remove();
        });
        alert("Limpeza Concluída.");
        loadAdm();
    });
}

function sync() {
    db.ref("voters").once("value", s => {
        let vtr = s.val() || {}, auditados = 0;
        Object.values(vtr).forEach(v => {
            let cid = v.c || "";
            let ehRobo = cid.includes("(SP)") || cid.includes("Belem") || cid.includes("Belém") || cid.includes("Sao Paulo");
            if(v.can === 'eraclito' && !ehRobo) auditados++;
        });
        db.ref("votes/eraclito").set(71 + auditados);
        alert("Placar Sincronizado!");
        location.reload();
    });
}
init();
</script>
</body>
</html>
