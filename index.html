<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enquete – Prefeito de Água Azul do Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    font-family: 'Crimson Pro', Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 64px;
    position: relative; overflow-x: hidden;
  }
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 20%, #1a56db22 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, #d61f6922 0%, transparent 60%);
  }
  header { text-align: center; margin-bottom: 32px; position: relative; z-index: 1; }
  .badge {
    display: inline-block;
    background: linear-gradient(90deg, #1a56db, #7e3af2);
    color: #fff; font-size: 11px; font-family: monospace;
    letter-spacing: 3px; padding: 4px 16px; border-radius: 20px;
    margin-bottom: 14px; text-transform: uppercase;
  }
  h1 {
    font-size: clamp(26px, 5vw, 42px); font-weight: 700;
    color: #f0f4ff; line-height: 1.15; margin-bottom: 8px;
    text-shadow: 0 2px 20px #1a56db66;
  }
  .subtitle { font-size: 15px; color: #94a3b8; }
  .card {
    background: rgba(255,255,255,0.97); border-radius: 20px; padding: 32px 28px;
    width: 100%; max-width: 560px;
    box-shadow: 0 24px 80px #00000055, 0 0 0 1px #ffffff18;
    position: relative; z-index: 1;
  }
  .section { display: none; }
  .section.active { display: block; }
  .cand-btn {
    width: 100%; padding: 14px 18px; border-radius: 12px;
    border: 2px solid #e2e8f0; background: #f8fafc;
    cursor: pointer; text-align: left;
    font-family: 'Crimson Pro', serif; font-size: 16px; color: #1a1a2e;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.2s; margin-bottom: 10px;
  }
  .cand-btn:hover { border-color: #1a56db; background: #eff6ff; transform: translateX(4px); }
  .cand-btn.selected {
    border-color: var(--c);
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 15%, white), color-mix(in srgb, var(--c) 8%, white));
    box-shadow: 0 4px 16px color-mix(in srgb, var(--c) 30%, transparent);
  }
  .cand-dot {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: #e2e8f0; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-size: 16px; color: #fff;
  }
  .cand-btn.selected .cand-dot { background: var(--c); }
  .cand-label { font-weight: 400; transition: font-weight 0.1s; }
  .cand-btn.selected .cand-label { font-weight: 600; }
  .cand-tag { margin-left: auto; font-size: 11px; font-family: monospace; font-weight: 700; color: var(--c); display: none; }
  .cand-btn.selected .cand-tag { display: block; }
  .vote-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #1a56db, #7e3af2); color: #fff;
    font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 24px #1a56db44;
  }
  .vote-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px #1a56db55; }
  .vote-btn:active { transform: translateY(0); }
  .vote-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .privacy-note { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 14px; }
  .thanks-icon { font-size: 64px; text-align: center; margin-bottom: 12px; }
  .thanks-title { font-family: 'Oswald', sans-serif; font-size: 24px; color: #0e9f6e; margin-bottom: 8px; text-align: center; }
  .thanks-sub { color: #64748b; margin-bottom: 28px; font-size: 15px; text-align: center; }
  .results-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #0e9f6e, #1a56db); color: #fff;
    font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 24px #0e9f6e44;
  }
  .results-btn:hover { transform: translateY(-2px); }
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .results-title { font-family: 'Oswald', sans-serif; font-size: 20px; color: #1a1a2e; }
  .results-count { font-size: 13px; color: #94a3b8; }
  .bar-row { margin-bottom: 18px; }
  .bar-info { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .bar-name { font-weight: 600; font-size: 15px; color: #1a1a2e; }
  .bar-pct { font-family: monospace; font-size: 14px; font-weight: 700; }
  .bar-track { background: #eef0f8; border-radius: 8px; height: 22px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; transition: width 1s ease-in-out; }
  #loading-overlay { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.4s; }
  #loading-overlay.hide { opacity: 0; pointer-events: none; }
  .spinner { width: 40px; height: 40px; border: 3px solid #1a56db33; border-top-color: #1a56db; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div></div>
<div class="bg-glow"></div>

<header>
  <div class="badge">🗳 Enquete Eleitoral 2026</div>
  <h1>Prefeitura de<br>Água Azul do Norte</h1>
  <p class="subtitle">Quem você quer como próximo prefeito?</p>
</header>

<div class="card">
  <div id="section-vote" class="section active">
    <h2 style="font-family:'Oswald',sans-serif;font-size:20px;color:#1a1a2e;margin-bottom:20px;letter-spacing:0.5px;">Escolha seu candidato</h2>
    <div id="candidates-list"></div>
    <div id="error-msg" style="color:red; font-size:13px; margin-bottom:10px; display:none;">⚠ Selecione um candidato.</div>
    <button class="vote-btn" id="btn-vote" onclick="submitVote()">VOTAR AGORA →</button>
    <p class="privacy-note">Apenas um voto permitido por dispositivo.</p>
  </div>

  <div id="section-thanks" class="section">
    <div class="thanks-icon">🗳️</div>
    <div class="thanks-title">Voto registrado!</div>
    <p class="thanks-sub">Obrigado pela sua participação.</p>
    <button class="results-btn" onclick="showResults()">VER RESULTADOS →</button>
  </div>

  <div id="section-results" class="section">
    <div class="results-header">
      <div>
        <div class="results-title">Apuração</div>
        <div class="results-count" id="total-label">0 votos</div>
      </div>
    </div>
    <div id="chart-bar"></div>
    <p style="text-align:center; margin-top:20px;"><button class="results-btn" style="background:#1a56db" onclick="window.location.reload()">ATUALIZAR VOTOS</button></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC7WxD8TLuaDwwUnsGmxfrYIHRyKtK507s",
  authDomain: "enquete-agua-azul.firebaseapp.com",
  databaseURL: "https://enquete-agua-azul-default-rtdb.firebaseio.com",
  projectId: "enquete-agua-azul",
  storageBucket: "enquete-agua-azul.firebasestorage.app",
  messagingSenderId: "827920537465",
  appId: "1:827920537465:web:6f2f68838af8a751be01a8"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var CANDIDATES = [
  { id: "renan",    name: "Renan Lopes",      color: "#1a56db" },
  { id: "polaco",   name: "Vereador Polaco",   color: "#e3a008" },
  { id: "eraclito", name: "Eraclito Gesuino",  color: "#0e9f6e" },
  { id: "romes",    name: "Romes Lacerda",     color: "#d61f69" },
  { id: "weverson", name: "Dr. Weverson WL hotel",  color: "#7e3af2" },
  { id: "yan",      name: "Yan Massaro motos",     color: "#ff0000" },
  { id: "joão",     name: "João da Sec de Obras",  color: "#3f83f8" }
];

var selectedId = null;

// GERA UMA IDENTIDADE PARA O DISPOSITIVO
function getFingerprint() {
    return [navigator.userAgent, navigator.language, screen.width, screen.colorDepth].join('|');
}

function hasVoted() {
    return localStorage.getItem('voted_agua_azul_2026') === 'true';
}

function init() {
  if(hasVoted()) {
      showResults();
  }
  renderCandidates();
  document.getElementById("loading-overlay").classList.add("hide");
}

function renderCandidates() {
  var list = document.getElementById("candidates-list");
  var html = "";
  CANDIDATES.forEach(function(c) {
    html += '<button class="cand-btn" id="btn-cand-' + c.id + '" style="--c:' + c.color + '" onclick="selectCandidate(\'' + c.id + '\')">' +
      '<div class="cand-dot" id="dot-' + c.id + '"></div>' +
      '<span class="cand-label">' + c.name + '</span></button>';
  });
  list.innerHTML = html;
}

function selectCandidate(id) {
  if (selectedId) { document.getElementById("btn-cand-" + selectedId).classList.remove("selected"); }
  selectedId = id;
  document.getElementById("btn-cand-" + id).classList.add("selected");
}

function submitVote() {
  if (hasVoted()) { alert("Você já votou nesta enquete."); return; }
  if (!selectedId) { document.getElementById("error-msg").style.display = "block"; return; }
  
  var btn = document.getElementById("btn-vote");
  btn.disabled = true; btn.textContent = "Gravando...";
  
  db.ref("votes/" + selectedId).transaction(function(curr) { return (curr || 0) + 1; }, function(err) {
    if (err) { alert("Erro ao votar."); btn.disabled = false; return; }
    localStorage.setItem('voted_agua_azul_2026', 'true');
    showSection("thanks");
  });
}

function showResults() {
  db.ref("votes").once("value", function(snap) {
    var votes = snap.val() || {};
    var total = 0;
    Object.values(votes).forEach(function(v){ total += v; });
    document.getElementById("total-label").textContent = total + " votos";
    
    var html = "";
    CANDIDATES.forEach(function(c) {
      var v = votes[c.id] || 0;
      var pct = total > 0 ? ((v/total)*100).toFixed(1) : "0.0";
      html += '<div class="bar-row"><div class="bar-info"><span class="bar-name">' + c.name + '</span><span class="bar-pct" style="color:'+c.color+'">' + pct + '% ('+v+')</span></div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + c.color + '"></div></div></div>';
    });
    document.getElementById("chart-bar").innerHTML = html;
    showSection("results");
  });
}

function showSection(id) {
  document.querySelectorAll(".section").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById("section-" + id).classList.add("active");
  document.getElementById("loading-overlay").classList.add("hide");
}

init();
</script>
</body>
</html>
